name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          cd apps/backend
          python -m pip install --upgrade pip uv
          uv pip install --system -e .[dev]
      - name: Ruff
        run: |
          cd apps/backend
          ruff check .
      - name: Black check
        run: |
          cd apps/backend
          black --check .
      - name: Pytest
        run: |
          cd apps/backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package.json
      - name: Install frontend deps
        run: |
          cd apps/frontend
          npm install
      - name: ESLint
        run: |
          cd apps/frontend
          npm run lint
      - name: Prettier check
        run: |
          cd apps/frontend
          npm run format
      - name: Build
        run: |
          cd apps/frontend
          npm run build

  ci-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Required checks failed: backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }}"
            exit 1
          fi
          echo "All required checks passed"

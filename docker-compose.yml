version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tickets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets_app}
      POSTGRES_USER: ${POSTGRES_USER:-tickets_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    container_name: tickets_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT_BACKEND:-8000}:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    container_name: tickets_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT_FRONTEND:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

[project]
name = "tickets-backend"
version = "0.1.0"
description = "FastAPI backend for tickets_app"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.40.0",
  "httpx==0.28.1",
  "openai==2.26.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.11.0",
  "psycopg[binary]==3.3.3",
  "sqlalchemy==2.0.44",
  "sqlmodel==0.0.24"
]

[dependency-groups]
dev = [
  "alembic==1.17.1",
  "pytest==9.0.2",
  "ruff==0.15.5",
  "mypy==1.18.2"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "N", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
pretty = true
exclude = "^tests/"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

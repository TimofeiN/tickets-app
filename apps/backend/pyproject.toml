[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tickets-backend"
version = "0.1.0"
description = "FastAPI backend for tickets_app"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.40.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.11.0",
  "psycopg[binary]==3.3.3",
  "sqlalchemy==2.0.44",
  "sqlmodel==0.0.24"
]

[project.optional-dependencies]
dev = [
  "alembic==1.17.1",
  "pytest==9.0.2",
  "httpx==0.28.1",
  "ruff==0.15.5",
  "black==26.3.0"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
